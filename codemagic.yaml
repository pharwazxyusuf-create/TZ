workflows:
  android:
    name: TZ Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project files
        script: flutter create --platforms=android .
      - name: Restore Temz Store logo
        script: base64 --decode assets/temz_logo.b64 > assets/temz_logo.jpg
      - name: Build release APK with Supabase
        script: flutter pub get && flutter build apk --release --target=lib/main_supabase.dart
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  windows:
    name: TZ Windows EXE
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Windows project files
        script: flutter create --platforms=windows .
      - name: Restore Temz Store logo
        script: powershell -NoProfile -Command "[IO.File]::WriteAllBytes('assets/temz_logo.jpg',[Convert]::FromBase64String((Get-Content -Raw assets/temz_logo.b64)))"
      - name: Build Windows with Supabase
        script: flutter pub get && flutter config --enable-windows-desktop && flutter build windows --release --target=lib/main_supabase.dart
      - name: Package Windows bundle
        script: cd build/windows/x64/runner/Release; 7z a -r ../TZ-Windows.zip ./*
    artifacts:
      - build/windows/x64/runner/TZ-Windows.zip
