workflows:
  android:
    name: TZ Android Production APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project
        script: flutter create --platforms=android .
      - name: Restore Temz logo
        script: base64 -D -i assets/temz_logo.b64 -o assets/temz_logo.jpg
      - name: Install dependencies
        script: flutter pub get
      - name: Configure Android auth and internet
        script: python3 tool/prepare_platforms.py
      - name: Repair TZ production source
        script: python3 tool/fix_tz_build.py
      - name: Restore login, forgot-password and agent registration UI
        script: python3 tool/restore_auth_ui.py
      - name: Fix Supabase PKCE recovery and password change
        script: python3 tool/auth_flow_fix.py
      - name: Analyze TZ app source only
        script: flutter analyze lib/tz_build.dart
      - name: Build release APK
        script: flutter build apk --release --target=lib/tz_build.dart
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios:
    name: TZ iOS Production Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Generate iOS project
        script: flutter create --platforms=ios .
      - name: Restore Temz logo
        script: base64 -D -i assets/temz_logo.b64 -o assets/temz_logo.jpg
      - name: Install dependencies
        script: flutter pub get
      - name: Configure iOS auth callback
        script: python3 tool/prepare_platforms.py
      - name: Repair TZ production source
        script: python3 tool/fix_tz_build.py
      - name: Restore login, forgot-password and agent registration UI
        script: python3 tool/restore_auth_ui.py
      - name: Fix Supabase PKCE recovery and password change
        script: python3 tool/auth_flow_fix.py
      - name: Analyze TZ app source only
        script: flutter analyze lib/tz_build.dart
      - name: Build release IPA
        script: flutter build ipa --release --no-codesign --target=lib/tz_build.dart
    artifacts:
      - build/ios/ipa/*.ipa

  windows:
    name: TZ Windows Production
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Windows project
        script: flutter create --platforms=windows .
      - name: Restore Temz logo
        script: powershell -NoProfile -Command "[IO.File]::WriteAllBytes('assets/temz_logo.jpg',[Convert]::FromBase64String((Get-Content -Raw assets/temz_logo.b64)))"
      - name: Install dependencies
        script: python -m pip install --upgrade pip; flutter pub get
      - name: Repair TZ production source
        script: python tool/fix_tz_build.py
      - name: Restore login, forgot-password and agent registration UI
        script: python tool/restore_auth_ui.py
      - name: Fix Supabase PKCE recovery and password change
        script: python tool/auth_flow_fix.py
      - name: Analyze TZ app source only
        script: flutter analyze lib/tz_build.dart
      - name: Build release Windows app
        script: flutter config --enable-windows-desktop && flutter build windows --release --target=lib/tz_build.dart
      - name: Package Windows app
        script: cd build/windows/x64/runner/Release; 7z a -r ../TZ-Windows.zip ./*
    artifacts:
      - build/windows/x64/runner/TZ-Windows.zip
